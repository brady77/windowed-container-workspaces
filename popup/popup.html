<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace Manager</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header>
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 128 128" fill="none" stroke="currentColor" stroke-width="4">
          <rect x="16" y="16" width="40" height="40" rx="4" ry="4"/>
          <rect x="16" y="72" width="40" height="40" rx="4" ry="4"/>
          <rect x="72" y="72" width="40" height="40" rx="4" ry="4"/>
          <rect x="25.5" y="36.5" width="12" height="12" rx="1.8" ry="1.8" fill="currentColor" stroke="none"/>
          <circle cx="31.5" cy="98.5" r="6" fill="currentColor" stroke="none"/>
          <path d="m 84.5,95.5 1.94,-1.94 q 1.06,-1.06 2.12,0 l 3.88,3.88 q 1.06,1.06 0,2.12 l -3.88,3.88 q -1.06,1.06 -2.12,0 l -3.88,-3.88 q -1.06,-1.06 0,-2.12 z" fill="currentColor" stroke="none"/>
        </svg>
        Workspaces
      </div>
      <button id="btn-new" class="btn-icon" title="New workspace">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </header>

    <!-- Workspace list -->
    <main id="workspace-list">
      <div class="empty-state" id="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        <p>No workspaces</p>
        <small>Click + to create one</small>
      </div>
    </main>

    <!-- Create / Edit modal -->
    <div id="modal-overlay" class="hidden">
      <div id="modal">
        <div class="modal-header">
          <h2 id="modal-title">New workspace</h2>
          <button id="btn-modal-close" class="btn-icon" title="Close">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <label>Name
          <input id="input-name" type="text" placeholder="Work, Projects, Personal…" maxlength="40" />
        </label>

        <div id="color-icon-section">
          <label>Container color
            <div class="color-picker" id="color-picker"></div>
          </label>

          <label>Container icon
            <div class="icon-picker" id="icon-picker"></div>
          </label>
        </div>

        <div class="modal-actions">
          <button id="btn-cancel" class="btn-secondary">Cancel</button>
          <button id="btn-save" class="btn-primary">Create</button>
        </div>
      </div>
    </div>

    <!-- Confirm delete dialog -->
    <div id="confirm-overlay" class="hidden">
      <div id="confirm-dialog">
        <p id="confirm-text">Delete workspace?</p>
        <small>This will also delete the container and all its data (cookies, etc.).</small>
        <div class="modal-actions">
          <button id="confirm-cancel" class="btn-secondary">Cancel</button>
          <button id="confirm-ok" class="btn-danger">Delete</button>
        </div>
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
