<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Backup &amp; Restore</title>
  <link rel="stylesheet" href="import-export.css" />
</head>
<body>
  <div id="app">
    <header>
      <span class="title">Backup &amp; Restore</span>
      <button id="btn-close" class="btn-icon" title="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </header>

    <main>
      <section>
        <div class="section-label">Export</div>
        <p class="section-desc">Download all workspaces as a JSON backup file.</p>
        <button id="btn-export" class="btn-primary">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Export workspaces
        </button>
      </section>

      <div class="divider"></div>

      <section>
        <div class="section-label">Import</div>
        <p class="section-desc">Restore workspaces from a previously exported backup file.</p>
        <button id="btn-import" class="btn-secondary">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Import from file
        </button>
        <input type="file" id="import-file" accept=".json" />
      </section>

      <div id="status" class="status"></div>
    </main>
  </div>
  <script src="import-export.js"></script>
</body>
</html>
